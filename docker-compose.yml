version: '3.8'

# Docker Compose for PDF Rendering Service
# 
# Usage:
#   docker-compose up --build
#   docker-compose down

services:
  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-service
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=dev
      
      # JVM Options
      - JAVA_OPTS=-Xmx1g -Djava.io.tmpdir=/tmp
      
      # PDF Render Configuration (via environment variables)
      # Spring Boot automatically maps these to pdf-render.fonts.* properties
      - PDF_RENDER_FONTS_REGULAR_PATH=classpath:/fonts/HarmonyOS_Sans_SC_Regular.ttf
      - PDF_RENDER_FONTS_DEFAULT_FAMILY=HarmonyOS Sans SC, DejaVu Sans, sans-serif
      
      # Debug settings (optional)
      - PDF_RENDER_DEBUG_ENABLED=false
      - PDF_RENDER_DEBUG_OUTPUT_DIRECTORY=/tmp/debug-html
      
      # Logging
      - LOGGING_LEVEL_COM_MERCURY_PDF_RENDER=INFO
      
    volumes:
      # Optional: Mount debug HTML output directory
      - ./debug-html:/tmp/debug-html
      
      # Optional: Mount logs directory
      - ./logs:/app/logs
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    
    networks:
      - pdf-network

networks:
  pdf-network:
    driver: bridge

