<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title}">Financial Report</title>
    <style th:inline="text">
        /* Custom font declarations (if configured) */
        [(${fontFaceDeclaration})]
        
        @page {
            size: A4;
            margin: 2cm 1.5cm;
            
            @top-center {
                content: "[(${title})]";
                font-size: 8pt;
                color: #999;
            }
            
            @bottom-left {
                content: "[(${footerText != null ? footerText : ''})]";
                font-size: 8pt;
                color: #666;
            }
            
            @bottom-right {
                content: "Page " counter(page) " / " counter(pages);
                font-size: 8pt;
                color: #666;
            }
        }
        
        body {
            font-family: [(${fontFamily})];
            font-size: 10pt;
            line-height: 1.6;
            color: #333;
        }
        
        /* Cover page styles */
        .cover-page {
            text-align: center;
            padding-top: 120px;
            page-break-after: always;
            position: relative;
            height: 257mm; /* A4 (297mm) minus top and bottom margins (2cm × 2 = 4cm) */
        }
        
        .cover-page h1 {
            font-size: 26pt;
            font-weight: bold;
            color: #1a3c6e;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        
        .cover-page h2 {
            font-size: 16pt;
            color: #555;
            margin-bottom: 40px;
            font-weight: normal;
        }
        
        .cover-metadata {
            margin-top: 80px;
            font-size: 11pt;
            color: #555;
        }
        
        .cover-metadata p {
            margin: 8px 0;
        }
        
        .cover-disclaimer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            font-size: 9pt;
            color: #999;
            text-align: center;
        }
        
        /* Markdown content styles */
        .markdown-content {
            margin: 0;
            line-height: 1.6;
        }

        .markdown-content h1 {
            font-size: 20pt;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 15px;
            color: #1a3c6e;
            border-bottom: 2px solid #1a3c6e;
            padding-bottom: 8px;
        }

        .markdown-content h2 {
            font-size: 15pt;
            font-weight: bold;
            margin-top: 24px;
            margin-bottom: 10px;
            color: #1a3c6e;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            page-break-after: avoid;
        }

        .markdown-content h3 {
            font-size: 12pt;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #2c5282;
            page-break-after: avoid;
        }

        .markdown-content h4 {
            font-size: 11pt;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 6px;
            color: #2c5282;
            page-break-after: avoid;
        }

        .markdown-content p {
            margin: 6px 0;
            text-align: justify;
        }

        .markdown-content blockquote {
            margin: 10px 0;
            padding: 8px 16px;
            border-left: 3px solid #1a3c6e;
            background-color: #f7f9fc;
            color: #555;
            font-size: 9pt;
        }

        .markdown-content blockquote p {
            margin: 4px 0;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin: 6px 0;
            padding-left: 24px;
        }

        .markdown-content li {
            margin: 3px 0;
        }

        .markdown-content strong {
            color: #1a3c6e;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid #dee2e6;
            margin: 16px 0;
        }

        /* Table styles for financial data */
        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 9pt;
            page-break-inside: auto;
        }

        .markdown-content thead {
            display: table-header-group;
        }

        .markdown-content th {
            background-color: #1a3c6e;
            color: #fff;
            font-weight: bold;
            padding: 6px 8px;
            border: 1px solid #1a3c6e;
            text-align: center;
            font-size: 9pt;
        }

        .markdown-content tbody tr {
            page-break-inside: avoid;
        }

        .markdown-content tbody tr:nth-child(even) {
            background-color: #f2f6fc;
        }

        .markdown-content td {
            padding: 5px 8px;
            border: 1px solid #d0d5dd;
            text-align: center;
            font-size: 9pt;
        }

        /* Section styles (for non-markdown sections) */
        .section {
            page-break-before: avoid;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 15pt;
            font-weight: bold;
            color: #1a3c6e;
            margin-top: 24px;
            margin-bottom: 12px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            page-break-after: avoid;
        }
        
        .section-paragraph {
            text-align: justify;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            page-break-inside: auto;
        }
        
        thead {
            display: table-header-group;
            background-color: #1a3c6e;
            color: #fff;
        }
        
        th {
            padding: 6px 8px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #1a3c6e;
            font-size: 9pt;
        }
        
        tbody tr {
            page-break-inside: avoid;
            page-break-after: auto;
        }
        
        tbody tr:nth-child(even) {
            background-color: #f2f6fc;
        }
        
        td {
            padding: 5px 8px;
            border: 1px solid #d0d5dd;
            font-size: 9pt;
        }
        
        /* Utility classes */
        .page-break {
            page-break-before: always;
        }
        
        .keep-together {
            page-break-inside: avoid;
        }
    </style>
</head>
<body>
    <!-- Cover Page -->
    <div class="cover-page">
        <h1 th:text="${title}">Report Title</h1>
        <h2 th:if="${subtitle != null}" th:text="${subtitle}">Subtitle</h2>
        
        <div class="cover-metadata">
            <p th:if="${reportNumber != null}">
                <strong>Report Number:</strong> <span th:text="${reportNumber}">N/A</span>
            </p>
            <p th:if="${reportDate != null}">
                <strong>Report Date:</strong> <span th:text="${reportDate}">N/A</span>
            </p>
        </div>
        
        <div class="cover-disclaimer">
            <p th:if="${coverDisclaimer != null}" th:text="${coverDisclaimer}">Disclaimer text</p>
            <p th:if="${coverDisclaimer == null}">注: 本报告由AI生成 仅供参考</p>
        </div>
    </div>
    
    <!-- Flexible Sections -->
    <div th:if="${sections != null and !sections.isEmpty()}">
        <div th:each="section, iterStat : ${sections}" 
             th:class="${section.cssClass != null ? 'section ' + section.cssClass : 'section'}">
            
            <!-- Section Title -->
            <h2 th:if="${section.title != null}" class="section-title" th:text="${section.title}">Section Title</h2>
            
            <!-- Paragraphs -->
            <div th:if="${section.paragraphs != null and !section.paragraphs.isEmpty()}">
                <p th:each="paragraph : ${section.paragraphs}" 
                   class="section-paragraph" 
                   th:text="${paragraph}">Paragraph content</p>
            </div>
            
            <!-- Tables -->
            <div th:if="${section.tables != null and !section.tables.isEmpty()}">
                <div th:each="table : ${section.tables}" class="keep-together">
                    <table>
                        <thead>
                            <tr>
                                <th th:each="header : ${table.headers}" th:text="${header}">Header</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${table.rows}">
                                <td th:each="cell : ${row}" th:text="${cell}">Cell</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Charts -->
            <div th:if="${section.charts != null and !section.charts.isEmpty()}">
                <div th:each="chart : ${section.charts}" class="chart-container">
                    <div class="chart-title" th:text="${chart.title}">Chart Title</div>
                    <img th:if="${chart.base64Image != null}" 
                         th:src="${chart.base64Image}" 
                         class="chart-image" 
                         alt="Chart"/>
                </div>
            </div>
            
            <!-- Custom Content -->
            <div th:if="${section.customContent != null}" 
                 class="custom-content" 
                 th:utext="${section.customContent}">Custom HTML content</div>

            <!-- Markdown Content -->
            <div th:if="${section.markdownHtml != null}" 
                 class="markdown-content"
                 th:utext="${section.markdownHtml}">Markdown content</div>
        </div>
    </div>
</body>
</html>
